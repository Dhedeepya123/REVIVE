services:
  postgres:
    image: postgres:17
    container_name: revive-postgres
    environment:
      POSTGRES_DB: revive
      POSTGRES_USER: revive
      POSTGRES_PASSWORD: revivepassword
    ports:
      - "5432:5432"
    volumes:
      - revive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revive -d revive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: revive-redis
    ports:
      - "6379:6379"
    volumes:
      - revive_redis_data:/data

volumes:
  revive_postgres_data:
  revive_redis_data:
